[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "openyam-coordinator-agentic"
version = "0.1.0"
description = "External generic OpenYAM coordinator and agentic DimOS blueprints"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = []

[project.entry-points."dimos.blueprints"]
openyam-planner-coordinator-agent = "openyam_coordinator_agentic.blueprints:openyam_planner_coordinator_agent"
openyam-grasp-graspgenx-agent = "openyam_coordinator_agentic.grasp:openyam_grasp_graspgenx_agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
dimos = { path = "../dimos", editable = true }
